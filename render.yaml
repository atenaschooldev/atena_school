services:
  - type: web
    name: atena-backend
    runtime: node
    region: frankfurt
    plan: free
    rootDir: apps/backend
    buildCommand: cd ../.. && npx --yes pnpm install && npx --yes pnpm --filter backend... build
    startCommand: node dist/main
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: APP_ENV
        value: production
      - key: LANDING_URL
        value: "https://atenaschool.com"
      - key: NEXT_PUBLIC_SITE_URL
        value: "https://atenaschool.com"
      - key: NEXT_PUBLIC_APP_URL
        value: "https://atena-school-app.vercel.app"
      - key: ADMIN_URL
        value: "https://atena-school-admin.vercel.app"
      - key: ALLOWED_ORIGINS
        value: "https://atenaschool.com,https://atena-school-landing-three.vercel.app,https://atena-school-app.vercel.app,https://atena-school-admin.vercel.app,http://localhost:3000,http://localhost:3001,http://localhost:3002"
      - key: REVALIDATION_SECRET
        value: "atena-revalidation-secret"
      # Database
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      # Supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      # Stripe
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
